{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4" style="background: linear-gradient(135deg, #F4EEFF 0%, #F7F8FF 100%);">
    <div class="w-full max-w-[430px] bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] p-10 border border-indigo-50">
        
        <!-- Logo -->
        <div class="text-center mb-8">
            <h2 class="text-2xl font-black tracking-tight text-slate-800">
                Smart<span class="text-primary">Civic</span>
            </h2>
            <p class="text-slate-500 text-sm mt-2 font-medium">Verify Email</p>
        </div>

        <form method="POST" class="space-y-5">
            {% csrf_token %}
            
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-slate-700 uppercase tracking-wider ml-1">OTP Code</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-key"></i>
                    </div>
                    <input type="text" name="otp" class="w-full pl-11 pr-4 py-3.5 bg-slate-50/50 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-slate-800 font-medium placeholder-slate-400 tracking-widest text-center" placeholder="123456" required>
                </div>
                <p class="text-[11px] text-slate-500 ml-1 text-center mt-2">Enter the 6-digit code sent to your email.</p>
            </div>

            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-primary to-[#7B66FF] text-white font-bold rounded-2xl shadow-lg shadow-primary/25 hover:shadow-xl hover:-translate-y-0.5 transition-all duration-200 mt-2">
                Verify & Login
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-100 flex flex-col gap-4 text-center">
            <a href="{% url 'resend_otp' %}" class="text-sm font-bold text-primary hover:text-indigo-700 transition-colors">
                Didn't receive it? Resend OTP
            </a>
            <a href="{% url 'login' %}" class="text-sm font-bold text-slate-500 hover:text-primary transition-colors">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Sign In
            </a>
        </div>
    </div>
</div>
{% endblock %}
