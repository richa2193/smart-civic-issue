<nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm" x-data="{ mobileMenuOpen: false }">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-20">
      
      <!-- Logo -->
      <div class="flex-shrink-0 flex items-center">
        <a href="{% url 'home' %}" class="flex items-center gap-2">
            <div class="w-10 h-10 bg-indigo-50 text-primary rounded-xl flex items-center justify-center text-xl">
                <i class="fa-solid fa-city"></i>
            </div>
            <span class="font-black text-2xl tracking-tight text-slate-800">
                Smart<span class="text-primary">Civic</span>
            </span>
        </a>
      </div>
      
      <!-- Desktop Menu -->
      <div class="hidden md:flex items-center space-x-8">
        <a href="{% url 'home' %}" class="text-slate-600 hover:text-primary font-medium transition-colors">Home</a>
        <a href="{% url 'about' %}" class="text-slate-600 hover:text-primary font-medium transition-colors">About</a>
        <a href="{% url 'contact' %}" class="text-slate-600 hover:text-primary font-medium transition-colors">Contact</a>
        
        <div class="w-px h-6 bg-slate-200 mx-2"></div>
        
        <!-- Dark Mode Toggle (Desktop) -->
        <button onclick="toggleDarkMode()" class="text-slate-400 hover:text-indigo-500 transition-colors focus:outline-none flex items-center justify-center w-10 h-10 rounded-full hover:bg-slate-50">
            <i class="fa-solid fa-moon dark-icon hidden"></i>
            <i class="fa-solid fa-sun light-icon"></i>
        </button>

        {% if user.is_authenticated %}
            <!-- User Dropdown (Alpine.js) -->
            <div class="relative" x-data="{ open: false }">
                <button @click="open = !open" @click.outside="open = false" class="flex items-center gap-2 text-slate-700 font-medium hover:text-primary transition-colors focus:outline-none">
                    <img src="https://ui-avatars.com/api/?name={{ user.email|urlencode }}&background=6c5ce7&color=fff" class="w-8 h-8 rounded-full border border-slate-200">
                    <span class="max-w-[120px] truncate">{{ user.email }}</span>
                    <i class="fa-solid fa-chevron-down text-xs text-slate-400"></i>
                </button>
                
                <div x-show="open" x-transition.opacity style="display: none;" class="absolute right-0 mt-3 w-48 bg-white rounded-xl shadow-lg border border-slate-100 py-1 z-50">
                    <a href="{% url 'dashboard' %}" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 hover:text-primary"><i class="fa-solid fa-table-columns w-5"></i> Dashboard</a>
                    <a href="{% url 'profile' %}" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 hover:text-primary"><i class="fa-solid fa-user w-5"></i> Profile</a>
                    <div class="border-t border-slate-100 my-1"></div>
                    <a href="{% url 'logout' %}" class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50"><i class="fa-solid fa-arrow-right-from-bracket w-5"></i> Logout</a>
                </div>
            </div>
        {% else %}
            <a href="{% url 'login' %}" class="text-slate-700 font-bold hover:text-primary transition-colors">Login</a>
            <a href="{% url 'register' %}" class="px-5 py-2.5 bg-gradient-to-r from-primary to-indigo-600 text-white font-bold rounded-xl shadow-md shadow-indigo-200 hover:shadow-lg hover:-translate-y-0.5 transition-all">Get Started</a>
        {% endif %}
      </div>
      
      <!-- Mobile menu button -->
      <div class="flex items-center md:hidden gap-4">
        <!-- Dark Mode Toggle (Mobile) -->
        <button onclick="toggleDarkMode()" class="text-slate-400 hover:text-indigo-500 transition-colors focus:outline-none">
            <i class="fa-solid fa-moon dark-icon hidden text-lg"></i>
            <i class="fa-solid fa-sun light-icon text-lg"></i>
        </button>
        
        <button @click="mobileMenuOpen = !mobileMenuOpen" class="text-slate-500 hover:text-slate-700 focus:outline-none p-2">
            <i class="fa-solid fa-bars text-2xl"></i>
        </button>
      </div>
      
    </div>
  </div>

  <!-- Mobile Menu -->
  <div x-show="mobileMenuOpen" x-transition class="md:hidden border-t border-slate-100 bg-white" style="display: none;">
    <div class="px-4 pt-2 pb-6 space-y-1">
        <a href="{% url 'home' %}" class="block px-3 py-3 text-base font-medium text-slate-700 hover:bg-slate-50 hover:text-primary rounded-lg">Home</a>
        <a href="{% url 'about' %}" class="block px-3 py-3 text-base font-medium text-slate-700 hover:bg-slate-50 hover:text-primary rounded-lg">About</a>
        <a href="{% url 'contact' %}" class="block px-3 py-3 text-base font-medium text-slate-700 hover:bg-slate-50 hover:text-primary rounded-lg">Contact</a>
        
        <div class="border-t border-slate-100 my-4"></div>
        
        {% if user.is_authenticated %}
            <div class="px-3 py-2 flex items-center gap-3 mb-2">
                <img src="https://ui-avatars.com/api/?name={{ user.email|urlencode }}&background=6c5ce7&color=fff" class="w-10 h-10 rounded-full">
                <div>
                    <p class="text-sm font-bold text-slate-800">{{ user.email }}</p>
                    <p class="text-xs text-slate-500">{{ user.role }}</p>
                </div>
            </div>
            <a href="{% url 'dashboard' %}" class="block px-3 py-3 text-base font-medium text-slate-700 hover:bg-slate-50 hover:text-primary rounded-lg"><i class="fa-solid fa-table-columns w-6"></i> Dashboard</a>
            <a href="{% url 'profile' %}" class="block px-3 py-3 text-base font-medium text-slate-700 hover:bg-slate-50 hover:text-primary rounded-lg"><i class="fa-solid fa-user w-6"></i> Profile</a>
            <a href="{% url 'logout' %}" class="block px-3 py-3 text-base font-medium text-red-600 hover:bg-red-50 rounded-lg"><i class="fa-solid fa-arrow-right-from-bracket w-6"></i> Logout</a>
        {% else %}
            <a href="{% url 'login' %}" class="block px-3 py-3 text-base font-medium text-slate-700 hover:bg-slate-50 hover:text-primary rounded-lg">Login</a>
            <a href="{% url 'register' %}" class="block px-3 py-3 mt-2 text-center text-base font-medium bg-primary text-white rounded-lg shadow-sm">Get Started</a>
        {% endif %}
    </div>
  </div>
</nav>
